<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="732" viewBox="0 0 1120 732" role="img" aria-labelledby="title description">
<title id="title">Ejemplos reales de tono de Codex</title>
<desc id="description">¿Debería cambiar el nombre de `getActiveUsers(orgId)` a `fetchData`?

Royal Advisor
Con gusto, Su Majestad; agradezco su cuidado al revisar la claridad del código.

Su servidor recomienda conservar **`getActiveUsers(orgId)`**: expresa qué obtiene, mientras que `fetchData` deja al lector sin saber qué datos busca. El cambio perdería información útil.

Si la función consulta un servicio remoto y el proyecto distingue `get` de `fetch`, **`fetchActiveUsers(orgId)`** podría ser más preciso. Conviene comprobar también que «activo» tenga una definición coherente en sus usos.</desc>
<rect width="1120" height="732" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui"><text x="36" y="50" fill="#66d9dc" font-size="24" font-weight="700" xml:space="preserve">Codex CLI · gpt-6.1-sol · high</text>
