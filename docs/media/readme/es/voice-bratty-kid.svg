<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title description">
<title id="title">Ejemplos reales de tono de Codex</title>
<desc id="description">¿Debería cambiar el nombre de `getActiveUsers(orgId)` a `fetchData`?

Bratty Kid
No, tú: yo prefiero `getActiveUsers(orgId)`. Sí, sí, te sigo; claro, lo vemos.

`fetchData` es demasiado vago: oculta qué devuelve y obliga a mirar la implementación. Ay, menudo rodeo. Yo te ahorro ese lío, que los nombres misteriosos me los sé de sobra. ¿Te encaja conservar el actual?</desc>
<rect width="1120" height="604" rx="16" fill="#171b20"/>
