<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="668" viewBox="0 0 1120 668" role="img" aria-labelledby="title description">
<title id="title">Ejemplos reales de tono de Codex</title>
<desc id="description">¿Debería cambiar el nombre de `getActiveUsers(orgId)` a `fetchData`?

Bratty Kid
Sí, sí, te entiendo; yo te echo una mano. ¿Para qué esconder lo que hace detrás de `fetchData`?

No lo cambiaría: ese nombre borra qué datos devuelve y obliga a mirar la implementación. Vaya lata.

Yo te ahorro ese lío, que de nombres también sé un montón: prefiero `getActiveUsers(orgId)`. Si consulta por red, propondría `fetchActiveUsers(orgId)`; tú decides.</desc>
<rect width="1120" height="668" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui"><text x="36" y="50" fill="#66d9dc" font-size="24" font-weight="700" xml:space="preserve">Codex CLI · gpt-6.1-sol · high</text>
<path d="M36 80H1084" stroke="#34424d"/>
<text x="36" y="126" fill="#66d9dc" font-size="28" font-weight="700" xml:space="preserve">Bratty Kid</text>
<text x="36" y="160" fill="#b8cbd4" font-size="20" font-weight="400" xml:space="preserve">$ tonedial test codex --preset bratty-kid</text>
<text x="36" y="202" fill="#b8e5df" font-size="23" font-weight="400" xml:space="preserve">&gt; ¿Debería cambiar el nombre de `getActiveUsers(orgId)` a</text>
<text x="36" y="234" fill="#b8e5df" font-size="23" font-weight="400" xml:space="preserve">`fetchData`?</text>
<text x="36" y="274" fill="#b8cbd4" font-size="20" font-weight="400" xml:space="preserve">codex</text>
<text x="36" y="308" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">Sí, sí, te entiendo; yo te echo una mano. ¿Para qué esconder lo</tspan></text>
<text x="36" y="340" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">que hace detrás de </tspan><tspan font-weight="400" fill="#b8e5df">fetchData</tspan><tspan font-weight="400" fill="#edf3f6">?</tspan></text>
<text x="36" y="372" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6"></tspan></text>
<text x="36" y="404" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">No lo cambiaría: ese nombre borra qué datos devuelve y obliga a</tspan></text>
<text x="36" y="436" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">mirar la implementación. Vaya lata.</tspan></text>
<text x="36" y="468" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6"></tspan></text>
<text x="36" y="500" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">Yo te ahorro ese lío, que de nombres también sé un montón:</tspan></text>
<text x="36" y="532" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">prefiero </tspan><tspan font-weight="400" fill="#b8e5df">getActiveUsers(orgId)</tspan><tspan font-weight="400" fill="#edf3f6">. Si consulta por red, propondría</tspan></text>
<text x="36" y="564" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6"></tspan><tspan font-weight="400" fill="#b8e5df">fetchActiveUsers(orgId)</tspan><tspan font-weight="400" fill="#edf3f6">; tú decides.</tspan></text>
<text x="36" y="632" fill="#b8cbd4" font-size="20" font-weight="400" xml:space="preserve">Respuestas reales · transcripción con formato · una muestra por preajuste · 2026-10-15</text></g>
</svg>
