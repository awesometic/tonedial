<title id="title">El mismo modelo. Menos rodeos.</title>
<desc id="description">This crashes when `name` is null. Should I use optional chaining, a default parameter, or an explicit guard? Choose one and give me the replacement function.

```js
function label(name) {
  return name.trim();
}
```

Codex predeterminado
Use an explicit guard. Default parameters don’t handle `null`, and optional chaining would return `undefined`.

```js
function label(name) {
  if (name == null) return '';
  return name.trim();
}
```

vibe-coder
Use an explicit guard, boss.

```js
function label(name) {
  if (name == null) return '';
  return name.trim();
}
```</desc>
