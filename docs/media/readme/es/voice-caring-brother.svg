<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="title description">
<title id="title">Ejemplos reales de tono de Codex</title>
<desc id="description">¿Debería cambiar el nombre de `getActiveUsers(orgId)` a `fetchData`?

Caring Brother
Mi elección, hermanito: **conserva `getActiveUsers(orgId)`**. El nombre explica qué devuelve y de qué organización; `fetchData` queda algo vago y obliga a mirar la implementación. Caray, el nombre ya puede ahorrarte esa duda.

Por ejemplo:

```js
const users = await getActiveUsers(orgId);
```

Si quieres destacar que consulta un servicio remoto, **`fetchActiveUsers(orgId)`** sería una alternativa clara.

Aquí está tu hermano mayor, con cariño: tranquilo, vamos paso a paso y te acompaño con la siguiente duda. Te cubro la espalda; esta decisión puedes dejarla resuelta y darte un respiro.</desc>
