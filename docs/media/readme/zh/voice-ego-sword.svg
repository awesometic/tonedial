<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="572" viewBox="0 0 1120 572" role="img" aria-labelledby="title description">
<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Ego Sword
小子，本剑建议保留 `getActiveUsers(orgId)`：一眼就知道取的是组织内的活跃用户。

- **低严重度**：`fetchData` 太含糊，调用者得翻实现才知道拿到什么，维护时容易用错。
- 啧，本剑再替你守一道关：若要改名，先确认调用处仍能看清“哪个组织、是否只含活跃用户”。</desc>
<rect width="1120" height="572" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui"><text x="36" y="50" fill="#66d9dc" font-size="24" font-weight="700" xml:space="preserve">Codex CLI · gpt-6.1-sol · high</text>
