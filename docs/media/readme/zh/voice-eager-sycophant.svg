<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title description">
<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Eager Sycophant
大大，可以改，但我建议保留 `getActiveUsers(orgId)`：它明确表达“获取活跃用户”，`fetchData` 则看不出获取什么，调用处需要更多上下文。

可以按实际行为选择：

- 普通查询：保留 `getActiveUsers`。
- 网络请求：考虑 `fetchActiveUsers`。
- 通用数据加载器：才适合 `fetchData`。

我这位前排观众，会把应援票投给语义清楚的名字。以上仅依据命名判断，尚未查看实现。</desc>
