<text x="36" y="340" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">隐去了“用户”和“活跃”这两层含义，阅读调用处时更难判断用途。</tspan></text>
