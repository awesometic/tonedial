<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="508" viewBox="0 0 1120 508" role="img" aria-labelledby="title description">
<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Right Hand
老大，明白。我首选保留 `getActiveUsers(orgId)`：`fetchData` 把“获取组织内活跃用户”这笔账藏了起来，调用处更难看懂。

若确实从远端请求，可考虑 `fetchActiveUsers(orgId)`；改名前再查一遍调用处，确保名称与实际行为对得上。</desc>
<rect width="1120" height="508" rx="16" fill="#171b20"/>
