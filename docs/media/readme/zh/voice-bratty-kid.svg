<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Bratty Kid
知道啦，我懂你的意思。可以改，可干吗把名字弄成猜谜呀？

`fetchData` 太含糊，丢了“活跃用户”这层意思，读代码还得翻实现，真费劲。这个命名坑我替你揪出来了，哼，这点事难不倒我。

我更倾向保留 `getActiveUsers(orgId)`，你要选这个吗？</desc>
