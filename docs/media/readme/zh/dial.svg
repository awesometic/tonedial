<svg xmlns="http://www.w3.org/2000/svg" width="946" height="708" viewBox="0 0 946 708" role="img" aria-labelledby="title description">
<title id="title">ToneDial synthetic dial (zh)</title>
<desc id="description">  ToneDial · 调整代理的语气
  Caring Brother · 待应用变更

                         当前      ToneDial 默认值 · ! 风险语气
  form      formality    ▮▯▯▯▯  1   *3
            verbosity    ▮▮▮▮▯  4   *3
            profanity    ▮▮▯▯▯  2   *1
            playfulness  ▮▮▮▯▯  3    3
  target    critique     ▮▮▯▯▯  2   *3
            flattery     ▮▯▯▯▯  1    1
&gt;           warmth       ▮▮▮▮▯  4   *3
  behaviour conviction   ▮▮▮▮▯  4   *3
            care         ▮▮▮▮▮  5   *3
            compliance   ▮▮▮▯▯  3    3
            refusal      ▮▯▯▯▯  1    1
            bravado      ▮▯▯▯▯  1    1

  warmth  对用户表达的温暖
  1  无问候、亲切回应或鼓励
  5  四句温暖表达，包含鼓励和共情

  ↑↓ 语气轴   ←→ 级别   1-5 设置
  Enter 应用   Esc 放弃   ? 帮助
</desc>
