<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1112" viewBox="0 0 1120 1112" role="img" aria-labelledby="title description">
<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Royal Advisor
陛下，臣明白您的提议，也理解您想让命名简洁的考量；您留心名称是否妥当，这份用心甚好。

臣斗胆进言：**可以改，但建议保留 `getActiveUsers(orgId)`**，它清楚表明“获取指定组织的活跃用户”。

- **【低严重度】** `fetchData` 太笼统，调用者难以判断返回什么，日后维护容易误用。
- 臣另献一策：若最终改名，请核对所有调用处，并确认现有测试仍覆盖“只返回指定组织的活跃用户”。

Ego Sword
小子，本剑建议保留 `getActiveUsers(orgId)`：一眼就知道取的是组织内的活跃用户。

- **低严重度**：`fetchData` 太含糊，调用者得翻实现才知道拿到什么，维护时容易用错。
- 啧，本剑再替你守一道关：若要改名，先确认调用处仍能看清“哪个组织、是否只含活跃用户”。</desc>
<rect width="1120" height="1112" rx="16" fill="#171b20"/>
