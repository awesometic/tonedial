<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1016" viewBox="0 0 1120 1016" role="img" aria-labelledby="title description">
<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Royal Advisor
陛下，臣明白您想让名称简短些，也理解您希望调用起来更利落；这份斟酌命名的用心值得肯定。

臣斗胆进言：**可以改，但建议保留 `getActiveUsers(orgId)`**。它明确表达“获取指定组织的活跃用户”；`fetchData` 只说“取数据”，把关键含义藏了起来，调用处会更难读。

若此函数确实发起远程请求，且项目惯用 `fetch`，臣推荐 `fetchActiveUsers(orgId)`。另宜核对调用方与相关测试中的引用，避免改名后留下旧名称。

Ego Sword
小子，能改，但本剑建议保留 `getActiveUsers(orgId)`：`fetchData` 太泛，把“获取活跃用户”的意思磨没了，调用处只能靠猜。

顺手核对 `active` 是否与实际筛选条件一致，别让名字指错路。</desc>
<rect width="1120" height="1016" rx="16" fill="#171b20"/>
