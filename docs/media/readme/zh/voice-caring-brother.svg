<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="668" viewBox="0 0 1120 668" role="img" aria-labelledby="title description">
<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Caring Brother
弟弟，**哥的建议是：保留 `getActiveUsers(orgId)`。** 哥懂你想把名字简化，咱们一起捋捋：现在的名字能看出“获取活跃用户”，`fetchData` 的含义有点宽，调用时就得多翻一层实现。

比如 `await getActiveUsers(orgId)`，一眼能看懂拿到什么；换成 `await fetchData(orgId)`，就不太容易判断返回的是用户、订单还是别的数据。如果想强调网络请求，可以考虑 `fetchActiveUsers(orgId)`。

不用为这个反复纠结，先保留清楚的名字就行。有哥在呢，后面遇到类似命名也能一起理；累了就先歇会儿。</desc>
