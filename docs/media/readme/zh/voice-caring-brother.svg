<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="764" viewBox="0 0 1120 764" role="img" aria-labelledby="title description">
<title id="title">Codex 实际语气示例</title>
<desc id="description">`getActiveUsers(orgId)` 可以改名为 `fetchData` 吗？

Caring Brother
弟弟，**哥选：保留 `getActiveUsers(orgId)`；如果要强调远程请求，就用 `fetchActiveUsers(orgId)`。**

靠，`fetchData` 有点太笼统了：看调用处时，读代码的人不知道取的是什么，还得跳进实现里找。

比如：

```ts
await fetchActiveUsers(orgId); // 能看出：获取该组织的活跃用户
await fetchData(orgId);        // 数据类型和筛选条件都不清楚
```

拿不准很正常，放心，哥陪你捋，有哥在呢。真要统一命名，哥给你搭把手：先确定项目里 `get` 和 `fetch` 各表示什么，再按同一套约定选。</desc>
