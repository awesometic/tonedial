<desc id="description">Should I rename `getActiveUsers(orgId)` to `fetchData`?

Ego Sword
Keep `getActiveUsers(orgId)`, rookie. `fetchData` throws the map away: it hides which data you’re fetching.

Check that “active” matches the function’s actual filter—I’d keep that edge sharp, too.</desc>
