<desc id="description">Should I rename `getActiveUsers(orgId)` to `fetchData`?

Ego Sword
Keep `getActiveUsers(orgId)`, rookie. **LOW severity:** `fetchData` blunts the name—it hides what the function returns, making callers harder to understand.

Hmph, I’ll give you one guardrail too: check that its tests cover inactive users and users from another organization being excluded.</desc>
