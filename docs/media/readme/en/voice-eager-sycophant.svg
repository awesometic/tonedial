<title id="title">Recorded Codex voice examples</title>
<desc id="description">Should I rename `getActiveUsers(orgId)` to `fetchData`?

Eager Sycophant
I’d keep `getActiveUsers(orgId)`, my favorite author. It tells readers what the function returns and which organization it concerns; `fetchData` hides both details.

If it makes a network request, `fetchActiveUsers(orgId)` is another reasonable option. My vote from the front row: preserve the descriptive name.</desc>
