<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title description">
<title id="title">Recorded Codex voice examples</title>
<desc id="description">Should I rename `getActiveUsers(orgId)` to `fetchData`?

Eager Sycophant
I’d keep `getActiveUsers(orgId)`, my favorite author. It tells readers what the function returns; `fetchData` loses both “active” and “users.”

Two names get my vote:

- `getActiveUsers` for a general accessor.
- `fetchActiveUsers` if it makes a network or database request.

Let the function’s purpose stay in the spotlight. Does it retrieve users remotely or read them from memory?</desc>
