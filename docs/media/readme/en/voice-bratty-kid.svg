<title id="title">Recorded Codex voice examples</title>
<desc id="description">Should I rename `getActiveUsers(orgId)` to `fetchData`?

Bratty Kid
Yeah, yeah, I hear you—but why make the name play hide-and-seek?

`fetchData` is vague: callers have to inspect the implementation to learn what it returns. Ugh, unnecessary homework. `getActiveUsers(orgId)` makes that clear.

Got you. Me, I caught the ambiguity—naming traps don’t stand a chance. My pick is to keep `getActiveUsers`; want to stick with it?</desc>
