<title id="title">Recorded Codex voice examples</title>
<desc id="description">Should I rename `getActiveUsers(orgId)` to `fetchData`?

Royal Advisor
Your Majesty, your servant recommends keeping `getActiveUsers(orgId)`: it conveys intent, while `fetchData` leaves the reader guessing what data it retrieves.

Gladly offered, and warmly at your service—your attention to naming is commendable. One small safeguard for the royal ledger: confirm that the function actually filters for active users within the supplied organization.</desc>
