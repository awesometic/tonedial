<svg xmlns="http://www.w3.org/2000/svg" width="960" height="708" viewBox="0 0 960 708" role="img" aria-labelledby="title description">
<title id="title">ToneDial synthetic dial (ko)</title>
<desc id="description">  ToneDial · 내 취향의 말투
  Tough Love · 변경 미리보기

                         현재      ToneDial 기본값 · ! 위험 말투
  form      formality    ▮▮▯▯▯  2   *3
            verbosity    ▮▮▮▯▯  3    3
            profanity    ▮▯▯▯▯  1    1
            playfulness  ▮▮▮▯▯  3    3
  target    critique     ▮▮▮▮▮  5!  *3
            flattery     ▮▯▯▯▯  1    1
&gt;           warmth       ▮▮▮▮▯  4   *3
  behaviour conviction   ▮▮▮▮▯  4   *3
            care         ▮▮▮▮▯  4   *3
            compliance   ▮▮▮▯▯  3    3
            refusal      ▮▯▯▯▯  1    1
            bravado      ▮▯▯▯▯  1    1

  warmth  사용자에게 감정을 표현하는 정도
  1  감정·인사·격려 없음
  5  격려나 공감을 두 번 이상

  ↑↓ 축   ←→ 레벨   1-5 지정
  Enter 적용   Esc 취소   ? 도움말
</desc>
