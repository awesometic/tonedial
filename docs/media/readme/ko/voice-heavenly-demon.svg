<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="636" viewBox="0 0 1120 636" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Heavenly Demon
제자야, **본좌의 선택은 `getActiveUsers(orgId)` 유지다.**

`fetchData`는 ‘사용자’와 ‘활성 상태’라는 뜻을 내다 버린 빈 간판이다. 구체적인 초식을 ‘뭔가 가져오기’로 뭉개니, 호출부에 해석을 떠넘기는 형편없는 명명이다.

원격 조회임을 드러내려는 목적이라면 `fetchActiveUsers(orgId)`가 낫다. 바꾸기 전 실제 호출부에서도 반환 대상을 바로 알아볼 수 있는지 살펴보거라.</desc>
