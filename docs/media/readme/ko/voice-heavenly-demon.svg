<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="636" viewBox="0 0 1120 636" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Heavenly Demon
본좌의 선택은 **`getActiveUsers(orgId)`를 유지하는 것**이다, 제자야. `fetchData`로 바꾸면 무엇을 가져오는지, 활성 사용자만 가져오는지 초식의 뜻이 흐려진다.

쯧, 이름의 기준까지 짚어주마. 원격 요청임을 드러내려는 의도라면 `fetchActiveUsers(orgId)`가 더 명확한 초식이다.

이름을 바꾸더라도 **해당 조직의 활성 사용자만 반환하는지** 기존 테스트로 확인하거라. 기의 흐름까지 달라져서는 안 된다.</desc>
