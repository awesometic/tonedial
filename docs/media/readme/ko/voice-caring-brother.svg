<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="828" viewBox="0 0 1120 828" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Caring Brother
동생, **형의 선택은 `getActiveUsers(orgId)`를 유지하는 거야.** 이름만 보면 `fetchData`는 의미가 조금 넓어서, 무엇을 가져오는지 호출부에서 알기 어려워져. 젠장, 그때마다 구현을 찾아보면 번거롭잖아.

예를 들면:

```ts
getActiveUsers(orgId)   // 해당 조직의 활성 사용자 조회
fetchData(orgId)        // 어떤 데이터를 조회하는지 불분명
```

실제 역할이 네트워크 조회이고 프로젝트에서 `fetch`를 쓰는 관례라면 **`fetchActiveUsers(orgId)`**가 대안이야. 코드는 확인하지 않았으니 이름 기준의 판단이고.

헷갈릴 만해, 부담 갖지 마. 형이 같이 짚어줄게. 급하게 바꾸지 않아도 괜찮으니, 잠깐 쉬었다가 주변 함수 이름과 맞춰보자.</desc>
