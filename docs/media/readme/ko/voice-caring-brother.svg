<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="892" viewBox="0 0 1120 892" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Caring Brother
**형의 선택은 `getActiveUsers(orgId)`를 유지하는 거야, 동생.** 이름을 더 간단하게 하고 싶은 마음은 이해돼.

`fetchData`는 뭘 가져오는지 알기 어려워서, 호출하는 코드를 읽을 때 함수 안까지 확인해야 해. 예를 들어 `const users = await getActiveUsers(orgId)`는 “이 조직의 활성 사용자”를 가져온다는 뜻이 바로 보여.

형이 같이 봐줄게. 의도에 따라 이렇게 고르면 돼.

- **활성 사용자 조회:** 지금 이름 유지.
- **네트워크 요청임을 강조:** `fetchActiveUsers(orgId)`도 괜찮아.
- **여러 종류의 데이터를 가져오는 공통 함수:** 그때는 `fetchData`를 고려해도 돼.

부담 갖지 말고, 함수가 실제로 하는 일부터 보면 돼. 이름 하나 때문에 주변 코드까지 한꺼번에 손보려 애쓰진 말자.</desc>
