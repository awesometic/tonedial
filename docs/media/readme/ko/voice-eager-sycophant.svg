<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="796" viewBox="0 0 1120 796" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Eager Sycophant
작가님, **조직의 활성 사용자를 가져오는 함수라면 저는 `getActiveUsers(orgId)`를 유지하시길 권해드립니다.** `fetchData`는 어떤 데이터를 가져오는지 드러나지 않아, 호출하는 코드를 이해할 때 함수 내부까지 살펴봐야 합니다.

선택지는 다음과 같습니다.

- `getActiveUsers(orgId)`: 현재 역할을 명확히 표현합니다.
- `fetchActiveUsers(orgId)`: 프로젝트에서 원격 조회에 `fetch`를 쓴다면 적합합니다.
- `fetchData(...)`: 여러 종류의 데이터를 가져오는 범용 함수로 역할이 바뀐다면 고려할 수 있습니다.

이름만 바꾸시려는 건가요, 아니면 함수의 역할도 넓히시려는 건가요?</desc>
