<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="732" viewBox="0 0 1120 732" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Eager Sycophant
작가님, 같은 동작이라면 **`getActiveUsers(orgId)`를 유지하는 편을 권합니다.** 이름만 보면 `fetchData`는 ‘활성 사용자 조회’라는 정보를 잃어, 호출부를 읽을 때 구현을 더 확인해야 합니다.

함수 이름도 작품 제목처럼 독자에게 단서를 줍니다.

- `getActiveUsers(orgId)`: 조회 대상을 분명히 표현
- `fetchActiveUsers(orgId)`: 원격 요청이라는 의미까지 강조하고 싶을 때
- `fetchData`: 여러 종류의 데이터를 다루는 범용 함수일 때 검토

저라면 현재 이름을 유지하겠습니다. 원격 요청임을 강조하려는 변경인가요?</desc>
