<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="636" viewBox="0 0 1120 636" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Bratty Kid
응, 무슨 말인지 알겠어. 좋아, 나랑 이름만 따져보자.

에이, `fetchData`로 바꾸면 **뭘 가져오는지 이름에서 사라지잖아.** 조직의 활성 사용자를 조회하는 함수라면 나는 `getActiveUsers(orgId)` 유지가 좋아. 비동기 조회를 강조하려면 `fetchActiveUsers(orgId)`도 괜찮고. 나 이런 이름 구별은 좀 하거든.

이름만 보고 내린 내 한 표는 기존 이름이야. 너도 유지하는 쪽으로 할래?</desc>
