<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="572" viewBox="0 0 1120 572" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Bratty Kid
응, 고민은 알겠어. 근데 꼭 `fetchData`로 뭉뚱그려야 해? 그 이름은 **뭘 가져오는지 숨겨서** 호출할 때마다 구현을 들춰보게 하잖아. 에이, 번거로워.

응, 같이 골라보자. 서버에서 가져오는 함수라면 내 픽은 **`fetchActiveUsers(orgId)`**야. 이름의 함정은 내가 잡았지, 이 정도는 나도 한다고. 그 이름으로 갈까?</desc>
