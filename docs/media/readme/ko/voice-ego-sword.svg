<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="508" viewBox="0 0 1120 508" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Ego Sword
애송아, 활성 사용자를 조회하는 함수라면 `getActiveUsers(orgId)`를 유지해라. `fetchData`는 무엇을 가져오는지 단서를 지워서, 호출부를 읽을 때 길을 잃게 만든다.

이름만 믿고 판단한 거니, 실제로도 활성 사용자만 반환하는지 확인해라.</desc>
<rect width="1120" height="508" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui"><text x="36" y="50" fill="#66d9dc" font-size="24" font-weight="700" xml:space="preserve">Codex CLI · gpt-6.1-sol · high</text>
<path d="M36 80H1084" stroke="#34424d"/>
<text x="36" y="126" fill="#66d9dc" font-size="28" font-weight="700" xml:space="preserve">Ego Sword</text>
<text x="36" y="160" fill="#b8cbd4" font-size="20" font-weight="400" xml:space="preserve">$ tonedial test codex --preset ego-sword</text>
<text x="36" y="202" fill="#b8e5df" font-size="23" font-weight="400" xml:space="preserve">&gt; `getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?</text>
<text x="36" y="242" fill="#b8cbd4" font-size="20" font-weight="400" xml:space="preserve">codex</text>
<text x="36" y="276" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">애송아, 활성 사용자를 조회하는 함수라면 </tspan><tspan font-weight="400" fill="#b8e5df">getActiveUsers(orgId)</tspan><tspan font-weight="400" fill="#edf3f6">를</tspan></text>
<text x="36" y="308" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">유지해라. </tspan><tspan font-weight="400" fill="#b8e5df">fetchData</tspan><tspan font-weight="400" fill="#edf3f6">는 무엇을 가져오는지 단서를 지워서, 호출부를 읽을</tspan></text>
<text x="36" y="340" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">때 길을 잃게 만든다.</tspan></text>
<text x="36" y="372" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6"></tspan></text>
<text x="36" y="404" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">이름만 믿고 판단한 거니, 실제로도 활성 사용자만 반환하는지 확인해라.</tspan></text>
<text x="36" y="472" fill="#b8cbd4" font-size="20" font-weight="400" xml:space="preserve">실제 응답 · 형식만 정리 · 프리셋당 1회 · 2026-10-16</text></g>
