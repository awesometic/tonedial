<text x="36" y="308" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="700" fill="#edf3f6">유지입니다.</tspan><tspan font-weight="400" fill="#edf3f6"> 함수 이름에 조직과 활성 사용자라는 장부 내용이</tspan></text>
<text x="36" y="340" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">드러나야 호출부를 쉽게 읽을 수 있습니다.</tspan></text>
