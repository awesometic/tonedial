<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Right Hand
보스, 알겠습니다. **저의 선택은 `getActiveUsers(orgId)` 유지입니다.** 함수 이름에 조직과 활성 사용자라는 장부 내용이 드러나야 호출부를 쉽게 읽을 수 있습니다.

- **낮음 · 가독성:** `fetchData`는 무엇을 가져오는지 숨겨, 식구들이 호출부마다 구현을 들춰야 합니다.
- 덧붙여, 비활성 사용자와 다른 조직의 사용자가 결과에 섞이지 않는 테스트로 장부를 지키면 좋겠습니다.</desc>
<rect width="1120" height="604" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui"><text x="36" y="50" fill="#66d9dc" font-size="24" font-weight="700" xml:space="preserve">Codex CLI · gpt-6.1-sol · high</text>
