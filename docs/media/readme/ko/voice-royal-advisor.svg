<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title description">
<title id="title">Codex의 실제 말투 응답</title>
<desc id="description">`getActiveUsers(orgId)`를 `fetchData`로 바꿔도 될까?

Royal Advisor
전하, 이름을 더 간결하게 다듬으시려는 뜻, 잘 알겠사옵니다. 이름의 적절함을 짚어 보신 점도 좋은 점검이옵니다.

신은 **`getActiveUsers(orgId)`를 유지하시길 권하옵니다.** 이름만 보아도 ‘활성 사용자 조회’라는 뜻이 드러나지만, `fetchData`는 그 정보를 지워 호출부의 뜻을 흐리게 하옵니다. 원격 요청임을 강조하려는 목적이라면 `fetchActiveUsers(orgId)`가 더 분명하옵니다.

코드를 살피지는 않았으므로 실제 동작까지 단정할 수는 없사옵니다. 변경을 택하시더라도 호출부와 관련 테스트가 조직 범위와 활성 조건을 보존하는지 함께 확인하시면 안심하실 수 있겠사옵니다.</desc>
