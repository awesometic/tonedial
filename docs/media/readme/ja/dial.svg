<svg xmlns="http://www.w3.org/2000/svg" width="904" height="708" viewBox="0 0 904 708" role="img" aria-labelledby="title description">
<title id="title">ToneDial synthetic dial (ja)</title>
<desc id="description">  ToneDial · エージェントの口調を調整
  Caring Brother · 未適用の変更

                         現在      ToneDial既定値 · ! 要注意
  form      formality    ▮▯▯▯▯  1   *3
            verbosity    ▮▮▮▮▯  4   *3
            profanity    ▮▮▯▯▯  2   *1
            playfulness  ▮▮▮▯▯  3    3
  target    critique     ▮▮▯▯▯  2   *3
            flattery     ▮▯▯▯▯  1    1
&gt;           warmth       ▮▮▮▮▯  4   *3
  behaviour conviction   ▮▮▮▮▯  4   *3
            care         ▮▮▮▮▮  5   *3
            compliance   ▮▮▮▯▯  3    3
            refusal      ▮▯▯▯▯  1    1
            bravado      ▮▯▯▯▯  1    1

  warmth  ユーザーに向ける温かさ
  1  挨拶・親しい受け止め・励ましなし
  5  段落ごとに優しさ・共感・慰め・安心

  ↑↓ 軸   ←→ レベル   1-5 設定
  Enter 適用   Esc 破棄   ? ヘルプ
</desc>
