<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="572" viewBox="0 0 1120 572" role="img" aria-labelledby="title description">
<title id="title">Codexの実際の口調例</title>
<desc id="description">`getActiveUsers(orgId)` を `fetchData` に改名してもいい？

Right Hand
なるほど、親分。**私のおすすめは `getActiveUsers(orgId)` の維持です。** `fetchData` では「アクティブなユーザーを取得する」という看板が消え、呼び出し側で意図が読めなくなります。

通信で取得する意味を強調したいなら `fetchActiveUsers(orgId)` が候補です。改名する際は、呼び出し側の一行だけでも用途が伝わるか確認しましょう。</desc>
