<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="796" viewBox="0 0 1120 796" role="img" aria-labelledby="title description">
<title id="title">Codexの実際の口調例</title>
<desc id="description">`getActiveUsers(orgId)` を `fetchData` に改名してもいい？

Caring Brother
兄ちゃんのおすすめは、**`getActiveUsers(orgId)` のままにすること**だよ。

うん、名前は迷うよな。`fetchData` だと「何を取得するのか」が見えにくくて、呼び出す側が中身を確認する手間が増えるんだ。

例えば、通信で取得することを名前に出したいなら、**`fetchActiveUsers(orgId)`** が候補になるよ。

お前が気になってるところ、一緒に整理しよう。まずは「有効なユーザーを取得する処理」か確認すれば大丈夫。迷ったら今の名前を残しておけるし、急いで変えなくていい。ひと息つきながら考えようぜ、兄ちゃんがついてる。</desc>
<rect width="1120" height="796" rx="16" fill="#171b20"/>
