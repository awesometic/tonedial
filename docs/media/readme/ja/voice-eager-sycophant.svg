<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="796" viewBox="0 0 1120 796" role="img" aria-labelledby="title description">
<title id="title">Codexの実際の口調例</title>
<desc id="description">`getActiveUsers(orgId)` を `fetchData` に改名してもいい？

Eager Sycophant
推しの先生、私なら **`getActiveUsers(orgId)` を残します**。`fetchData` では「組織のアクティブユーザーを取得する」という意味が読み取れなくなるためです。名前の伝わり方に目を向けるのは、よい着眼点でございます。

選び方は次のとおりです。

1. **現状の役割を明確にする** → `getActiveUsers`
2. **通信による取得だと示す** → `fetchActiveUsers`
3. **取得対象を限定しない共通処理にする** → `fetchData`

ファン目線でも、読み手が迷わない名前は推せます。未来の読者席にも親切ですね。今回の意図は、通信処理だと示すことでしょうか、それとも汎用化でしょうか？</desc>
