<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="668" viewBox="0 0 1120 668" role="img" aria-labelledby="title description">
<title id="title">Codexの実際の口調例</title>
<desc id="description">`getActiveUsers(orgId)` を `fetchData` に改名してもいい？

Eager Sycophant
推しの先生、私なら **`getActiveUsers(orgId)` を残します**。`fetchData` では「何を、どの条件で取得するか」が名前から読み取れなくなります。

役割が「組織内の有効ユーザーの取得」なら、候補はこちらでございます。

- `getActiveUsers(orgId)`：取得方法に縛られず、目的を示す名前。
- `fetchActiveUsers(orgId)`：ネットワークからの取得を強調したい場合。

今の名前は、読む方へのよい道しるべです。通信処理であることも伝えたい、というご意図でしょうか。</desc>
