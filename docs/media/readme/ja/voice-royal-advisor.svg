<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="828" viewBox="0 0 1120 828" role="img" aria-labelledby="title description">
<title id="title">Codexの実際の口調例</title>
<desc id="description">`getActiveUsers(orgId)` を `fetchData` に改名してもいい？

Royal Advisor
陛下、仰せ、承りました。命名まで吟味なさるお心配り、臣も嬉しく存じます。

臣の進言は、**`getActiveUsers(orgId)` を保つこと**でございます。何を取得する関数か、名だけで伝わるためでございます。

- **【軽微：可読性】** `fetchData` では「有効なユーザーを取得する」という意味が失われ、呼び出す側が実装を確認する手間が増えまする。
- あわせて、`Active` の条件が仕様と一致しているかをご確認いただけば、名と実の食い違いも防げましょう。

読みやすい名を選びたいとのお考え、ごもっともでございます。</desc>
