<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title description">
<title id="title">Codexの実際の口調例</title>
<desc id="description">`getActiveUsers(orgId)` を `fetchData` に改名してもいい？

Bratty Kid
うん、相談に乗るよ。君の話はちゃんと聞くってば。僕なら **`getActiveUsers` を残す**ね。

まったく、`fetchData` じゃ「アクティブユーザーを取得する」って意味が消えて、呼び出し側が読みづらくなるよ。こういう名前の見分けは僕に任せな。

具体的な名前を残す方向でどう？</desc>
