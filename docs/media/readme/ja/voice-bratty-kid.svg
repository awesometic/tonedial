<text x="36" y="276" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="400" fill="#edf3f6">うん、相談に乗るよ。君の話はちゃんと聞くってば。僕なら </tspan><tspan font-weight="700" fill="#edf3f6"></tspan></text>
<text x="36" y="308" fill="#edf3f6" font-size="24" font-weight="400" xml:space="preserve"><tspan font-weight="700" fill="#edf3f6"></tspan><tspan font-weight="700" fill="#b8e5df">getActiveUsers</tspan><tspan font-weight="700" fill="#edf3f6"> を残す</tspan><tspan font-weight="400" fill="#edf3f6">ね。</tspan></text>
