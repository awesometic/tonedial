<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="508" viewBox="0 0 1120 508" role="img" aria-labelledby="title description">
<title id="title">Codexの実際の口調例</title>
<desc id="description">`getActiveUsers(orgId)` を `fetchData` に改名してもいい？

Ego Sword
若造、俺なら `getActiveUsers(orgId)` のままにする。`fetchData` じゃ取得対象も条件も見えず、名前がなまくらになる。

ついでに、別組織や非アクティブのユーザーが混ざらないテストも確認しとけ。</desc>
