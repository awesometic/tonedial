<svg xmlns="http://www.w3.org/2000/svg" width="638" height="456" viewBox="0 0 638 456" role="img" aria-labelledby="title description">
<title id="title">ToneDial screen (en · dial help)</title>
<desc id="description">  Dial keys
  Caring Brother · current voice

  ↑↓ / j k / Tab  select axis
  ←→ / h l  change level
  1-5  set level
  Enter  apply changes
  Esc / q / Ctrl+C  discard changes
  Ctrl+Z  suspend; fg resumes
  ?  show or hide help
  *  differs from ToneDial's default
  !  risky tone; levels remain selectable

  ? return to dial   Esc discard
</desc>
<rect width="100%" height="100%" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui" font-size="22"><text x="60" y="48" fill="#edf3f6" font-weight="700" opacity="1">Dial keys</text>
<text x="60" y="76" fill="#66d9dc" font-weight="400" opacity="1">Caring Brother · current voice</text>
<text x="60" y="132" fill="#edf3f6" font-weight="400" opacity="0.65">↑↓ / j k / Tab</text>
<text x="284" y="132" fill="#edf3f6" font-weight="400" opacity="0.65">select axis</text>
<text x="60" y="160" fill="#edf3f6" font-weight="400" opacity="0.65">←→ / h l</text>
<text x="200" y="160" fill="#edf3f6" font-weight="400" opacity="0.65">change level</text>
<text x="60" y="188" fill="#edf3f6" font-weight="400" opacity="0.65">1-5</text>
<text x="130" y="188" fill="#edf3f6" font-weight="400" opacity="0.65">set level</text>
<text x="60" y="216" fill="#edf3f6" font-weight="400" opacity="0.65">Enter</text>
<text x="158" y="216" fill="#edf3f6" font-weight="400" opacity="0.65">apply changes</text>
<text x="60" y="244" fill="#edf3f6" font-weight="400" opacity="0.65">Esc / q / Ctrl+C</text>
<text x="312" y="244" fill="#edf3f6" font-weight="400" opacity="0.65">discard changes</text>
<text x="60" y="272" fill="#edf3f6" font-weight="400" opacity="0.65">Ctrl+Z</text>
<text x="172" y="272" fill="#edf3f6" font-weight="400" opacity="0.65">suspend; fg resumes</text>
<text x="60" y="300" fill="#edf3f6" font-weight="400" opacity="0.65">?</text>
<text x="102" y="300" fill="#edf3f6" font-weight="400" opacity="0.65">show or hide help</text>
<text x="60" y="328" fill="#edf3f6" font-weight="400" opacity="0.65">*</text>
<text x="102" y="328" fill="#edf3f6" font-weight="400" opacity="0.65">differs from ToneDial's default</text>
<text x="60" y="356" fill="#edf3f6" font-weight="400" opacity="0.65">!</text>
<text x="102" y="356" fill="#edf3f6" font-weight="400" opacity="0.65">risky tone; levels remain selectable</text>
<text x="60" y="412" fill="#edf3f6" font-weight="400" opacity="0.65">? return to dial</text>
<text x="326" y="412" fill="#edf3f6" font-weight="400" opacity="0.65">Esc discard</text></g>
</svg>
