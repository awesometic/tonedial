<svg xmlns="http://www.w3.org/2000/svg" width="498" height="372" viewBox="0 0 498 372" role="img" aria-labelledby="title description">
<title id="title">ToneDial screen (en · update-invalid)</title>
<desc id="description">ToneDial · update

  tonedial &lt;VERSION&gt;

  Package update:
    npm update -g tonedial
  --dry-run · nothing written

  Refresh application files:
    tonedial doctor --fix
  ⚠ Saved settings are invalid.
</desc>
<rect width="100%" height="100%" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui" font-size="22"><text x="32" y="48" fill="#edf3f6" font-weight="400" opacity="1">ToneDial · update</text>
<text x="60" y="104" fill="#edf3f6" font-weight="400" opacity="1">tonedial &lt;VERSION&gt;</text>
<text x="60" y="160" fill="#edf3f6" font-weight="400" opacity="1">Package update:</text>
<text x="88" y="188" fill="#edf3f6" font-weight="400" opacity="1">npm update -g tonedial</text>
<text x="60" y="216" fill="#edf3f6" font-weight="400" opacity="1">--dry-run · nothing written</text>
<text x="60" y="272" fill="#edf3f6" font-weight="400" opacity="1">Refresh application files:</text>
<text x="88" y="300" fill="#edf3f6" font-weight="400" opacity="1">tonedial doctor --fix</text>
<text x="60" y="328" fill="#edf3f6" font-weight="400" opacity="1">⚠ Saved settings are invalid.</text></g>
</svg>
