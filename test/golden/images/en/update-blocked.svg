<svg xmlns="http://www.w3.org/2000/svg" width="638" height="512" viewBox="0 0 638 512" role="img" aria-labelledby="title description">
<title id="title">ToneDial screen (en · update-blocked)</title>
<desc id="description">ToneDial · update

  tonedial &lt;VERSION&gt;

  Package update:
    npm update -g tonedial
  --dry-run · nothing written

  Shared ToneDial state:
