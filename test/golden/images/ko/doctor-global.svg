<svg xmlns="http://www.w3.org/2000/svg" width="1114" height="596" viewBox="0 0 1114 596" role="img" aria-labelledby="title description">
<title id="title">ToneDial screen (ko · doctor --global)</title>
<desc id="description">ToneDial · doctor

  전역 범위(모든 프로젝트 공유)
  &lt;ROOT&gt;

  문제 1건

  검사
  · 에이전트 훅
    연결 안 됨: Claude Code, Antigravity IDE/Desktop, Codex CLI

  ! PATH의 tonedial
    PATH에서 tonedial을 찾지 못해 스킬과 TONE.md의 대체 안내 줄이 이 명령을
    실행할 수 없습니다.
    전역 경로 확인:
    npm prefix -g
    그 경로의 bin 폴더를 PATH에 추가하세요(macOS/Linux).

  tonedial wire --global
</desc>
