<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="428" viewBox="0 0 1296 428" role="img" aria-labelledby="title description">
<title id="title">ToneDial screen (ko · doctor-recovery-invalid-narrow)</title>
<desc id="description">ToneDial · doctor

  검사 범위: 전역
  &lt;ROOT&gt;

  읽을 수 없는 작업 기록 때문에 복구를 진행할 수 없습니다.
  이번 실행에서는 파일을 바꾸지 않았습니다.

  작업 ID:
  ffffffffffffffffffffffffffffffff
  앱을 복구하려면 이 기록을 먼저 격리해야 합니다. 원본
  바이트는 롤백 기록에 보존됩니다.
  tonedial doctor --fix --quarantine-operation ffffffffffffffffffffffffffffffff --global
</desc>
<rect width="100%" height="100%" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui" font-size="22"><text x="32" y="48" fill="#edf3f6" font-weight="400" opacity="1">ToneDial · doctor</text>
<text x="60" y="104" fill="#edf3f6" font-weight="400" opacity="1">검사 범위: 전역</text>
<text x="60" y="132" fill="#edf3f6" font-weight="400" opacity="1">&lt;ROOT&gt;</text>
<text x="60" y="188" fill="#edf3f6" font-weight="400" opacity="1">읽을 수 없는 작업 기록 때문에 복구를 진행할 수 없습니다.</text>
<text x="60" y="216" fill="#edf3f6" font-weight="400" opacity="1">이번 실행에서는 파일을 바꾸지 않았습니다.</text>
<text x="60" y="272" fill="#edf3f6" font-weight="400" opacity="1">작업 ID:</text>
<text x="60" y="300" fill="#edf3f6" font-weight="400" opacity="1">ffffffffffffffffffffffffffffffff</text>
<text x="60" y="328" fill="#edf3f6" font-weight="400" opacity="1">앱을 복구하려면 이 기록을 먼저 격리해야 합니다. 원본</text>
<text x="60" y="356" fill="#edf3f6" font-weight="400" opacity="1">바이트는 롤백 기록에 보존됩니다.</text>
<text x="60" y="384" fill="#edf3f6" font-weight="400" opacity="1">tonedial doctor --fix --quarantine-operation ffffffffffffffffffffffffffffffff --global</text></g>
</svg>
