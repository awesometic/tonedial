<svg xmlns="http://www.w3.org/2000/svg" width="1212" height="512" viewBox="0 0 1212 512" role="img" aria-labelledby="title description">
<title id="title">ToneDial screen (ko · doctor-recovery-stopped)</title>
<desc id="description">ToneDial · doctor

  검사 범위: 전역
  &lt;ROOT&gt;

  진행 중이거나 복구가 필요한 작업이 있습니다. 이번 실행에서는 파일을 바꾸지
  않았습니다.
  ffffffffffffffffffffffffffffffff  미완료

  앱 복구를 이어가려면:
  tonedial doctor --fix --from-operation ffffffffffffffffffffffffffffffff --global

  이전 파일로 돌아가기:
  tonedial doctor --fix --rollback ffffffffffffffffffffffffffffffff

  tonedial doctor --global --json
</desc>
<rect width="100%" height="100%" rx="16" fill="#171b20"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, system-ui" font-size="22"><text x="32" y="48" fill="#edf3f6" font-weight="400" opacity="1">ToneDial · doctor</text>
<text x="60" y="104" fill="#edf3f6" font-weight="400" opacity="1">검사 범위: 전역</text>
<text x="60" y="132" fill="#edf3f6" font-weight="400" opacity="1">&lt;ROOT&gt;</text>
<text x="60" y="188" fill="#edf3f6" font-weight="400" opacity="1">진행 중이거나 복구가 필요한 작업이 있습니다. 이번 실행에서는 파일을 바꾸지</text>
<text x="60" y="216" fill="#edf3f6" font-weight="400" opacity="1">않았습니다.</text>
<text x="60" y="244" fill="#edf3f6" font-weight="400" opacity="1">ffffffffffffffffffffffffffffffff</text>
<text x="536" y="244" fill="#edf3f6" font-weight="400" opacity="1">미완료</text>
<text x="60" y="300" fill="#edf3f6" font-weight="400" opacity="1">앱 복구를 이어가려면:</text>
<text x="60" y="328" fill="#edf3f6" font-weight="400" opacity="1">tonedial doctor --fix --from-operation ffffffffffffffffffffffffffffffff --global</text>
<text x="60" y="384" fill="#edf3f6" font-weight="400" opacity="1">이전 파일로 돌아가기:</text>
<text x="60" y="412" fill="#edf3f6" font-weight="400" opacity="1">tonedial doctor --fix --rollback ffffffffffffffffffffffffffffffff</text>
<text x="60" y="468" fill="#edf3f6" font-weight="400" opacity="1">tonedial doctor --global --json</text></g>
</svg>
