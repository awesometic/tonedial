<title id="title">ToneDial screen (npm-permission)</title>
<desc id="description">ToneDial · update

  업데이트 가능 · 0.1.15 → 9.8.7
  설치됨  0.1.15 · 2026-11-01 배포
  최신    9.8.7 · 2026-11-03 배포

  패키지 업데이트:
    npm update -g tonedial --prefix "&lt;ROOT&gt;/npm prefix"
npm 업데이트에 필요한 쓰기 권한이 없습니다 (EACCES).
&lt;ROOT&gt;/npm prefix
설정과 프리셋을 백업한 뒤 사용자 소유 경로에 다시 설치해 주세요.
복구 절차:
https://github.com/awesometic/tonedial/blob/main/docs/USAGE.md#npm-permissions
</desc>
