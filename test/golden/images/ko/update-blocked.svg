<svg xmlns="http://www.w3.org/2000/svg" width="610" height="624" viewBox="0 0 610 624" role="img" aria-labelledby="title description">
<title id="title">ToneDial screen (ko · update-blocked)</title>
<desc id="description">ToneDial · update

  tonedial &lt;VERSION&gt;

  설치됨  &lt;VERSION&gt; · 2026-11-01 배포
  최신    9.9.9 · 2026-11-03 배포
  업데이트 가능 · &lt;VERSION&gt; → 9.9.9

  패키지 업데이트:
    npm update -g tonedial
  --dry-run · 기록하지 않음

  ToneDial 공통 상태 디렉터리:
  &lt;ROOT&gt;/state

  표시된 기본 파일을 확인하려면:
    tonedial doctor
  ⚠ ToneDial 관리 파일 아님 · 보존됨
    presets/builtin/caring-brother.json
    presets/builtin/bratty-kid.json
</desc>
